name: Purge old Actions runs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-actions-once.yml

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id')"
          deleted=0
          for id in $ids; do
            if [ "$id" = "$CURRENT_RUN" ]; then
              continue
            fi
            gh api --method DELETE "repos/$REPO/actions/runs/$id" || true
            deleted=$((deleted + 1))
          done
          echo "Deleted $deleted previous workflow runs"
